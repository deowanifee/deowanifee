<!DOCTYPE html>
<html lang="hi">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>पासवर्ड बदलें - श्री देववाणी विद्या मन्दिर</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card p-4 shadow" style="width: 100%; max-width: 450px;">
        <h4 class="text-center text-primary mb-3">🔒 यूज़रनेम और पासवर्ड बदलें</h4>

        {% if msg %}
            <div class="alert alert-success p-2 small">{{ msg }}</div>
        {% endif %}
        {% if error %}
            <div class="alert alert-danger p-2 small">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">नया यूज़रनेम (New Username)</label>
                <input type="text" name="new_username" class="form-control" value="{{ username }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">नया पासवर्ड (New Password)</label>
                <input type="password" name="new_password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-danger fw-bold">गुप्त मास्टर पिन (Master PIN)</label>
                <input type="password" name="master_pin" class="form-control" placeholder="आपका 6-अंकों का पिन: 615971" required>
                <small class="text-muted">गुप्त पिन: 615971</small>
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold mb-2">बदलाव सुरक्षित करें</button>
            <a href="/dashboard" class="btn btn-secondary w-100">डैशबोर्ड पर वापस जाएं</a>
        </form>
    </div>
</body>
</html>
