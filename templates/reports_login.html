<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>रिपोर्ट्स लॉगिन - श्री देववाणी विद्या मन्दिर, पतालेश्वर, छिंदवाड़ा</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 text-center" style="width: 380px;">
        <h5 class="text-primary fw-bold mb-1">श्री देववाणी विद्या मन्दिर</h5>
        <p class="text-muted small mb-3">सत्र-वार रिपोर्ट्स लॉगिन</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">रिपोर्ट्स पिन दर्ज करें</label>
                <!-- पिन टाइप करते वक्त छिप जाएगा -->
                <input type="password" name="pin" class="form-control" placeholder="पिन लिखें..." required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-warning w-100 fw-bold">रिपोर्ट्स देखें</button>
        </form>
        <div class="text-center mt-3">
            <a href="/dashboard" class="small text-decoration-none">वापस डैशबोर्ड जाएं</a>
        </div>
    </div>
</body>
</html>
