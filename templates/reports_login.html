<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>रिपोर्ट्स लॉगिन - श्री देववाणी विद्या मन्दिर</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 350px;">
        <h5 class="mb-3 text-center">रिपोर्ट्स सुरक्षित पेज</h5>
        {% if error %}
        <div class="alert alert-danger py-1 small">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">रिपोर्ट्स पासवर्ड दर्ज करें:</label>
                <input type="password" name="reports_password" class="form-control" placeholder="पासवर्ड (799)" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-2">खोलें</button>
            <a href="/dashboard" class="btn btn-secondary w-100 btn-sm">डैशबोर्ड पर वापस जाएं</a>
        </form>
    </div>
</body>
</html>
