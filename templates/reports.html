<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>सत्र-वार रिपोर्ट्स - श्री देववाणी विद्या मन्दिर</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2>सत्र-वार फीस और कलेक्शन रिपोर्ट</h2>
        <a href="/dashboard" class="btn btn-primary mb-3">← डैशबोर्ड पर वापस जाएं</a>
        <table class="table table-bordered table-striped bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>शैक्षणिक सत्र</th>
                    <th>कुल निर्धारित फीस</th>
                    <th>कुल प्राप्त फीस (Collected)</th>
                    <th>कुल छूट (Discount)</th>
                    <th>कुल शेष बकाया (Balance)</th>
                </tr>
            </thead>
            <tbody>
                {% for row in summary %}
                <tr>
                    <td class="fw-bold">{{ row[0] }}</td>
                    <td>₹{{ row[1] }}</td>
                    <td class="text-success fw-bold">₹{{ row[2] }}</td>
                    <td class="text-danger">₹{{ row[3] }}</td>
                    <td class="text-danger fw-bold">₹{{ row[1] - (row[2] + row[3]) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
