<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>लॉगिन - श्री देववाणी विद्या मन्दिर, पतालेश्वर, छिंदवाड़ा</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow p-4 text-center" style="width: 380px;">
        <!-- स्कूल का नाम और लोगो इंडिकेशन -->
        <h5 class="text-primary fw-bold mb-1">श्री देववाणी विद्या मन्दिर</h5>
        <p class="text-muted small mb-3">पतालेश्वर, छिंदवाड़ा</p>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                    <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label class="form-label small fw-bold">पासवर्ड दर्ज करें (डिफ़ॉल्ट: 8109)</label>
                <!-- पासवर्ड टाइप करते वक्त अक्षर छुपेंगे (Masked) -->
                <input type="password" name="password" class="form-control" placeholder="••••" required autocomplete="off">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">लॉग इन करें</button>
        </form>
    </div>
</body>
</html>
